[project]
name = "open-frontier-obelisk"
version = "0.0.0"
description = "Tooling for Open Frontier Curriculum"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
docs = ["zensical>=0.0.57,<0.1"]
validate = ["jsonschema>=4.20", "pyyaml>=6"]

[dependency-groups]
dev = [
	"zensical>=0.0.57,<0.1",
	"jsonschema>=4.20",
	"pyyaml>=6",
	"ruff>=0.12,<1",
	"python-semantic-release==10.6.2",
]

[tool.uv]
package = false

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = ["release.toml:version"]
commit_message = "chore(release): v{version} [skip ci]"
build_command = "python scripts/sync_release_version.py && python scripts/verify_release.py && git add -- CITATION.cff data docs BUILD_MANIFEST.json CONTENT_MATURITY.md SOURCE_MATURITY.md RELEASE_READINESS.md reports/obelisk-audit.json reports/release-verification.json"
assets = []
allow_zero_version = true
major_on_zero = true

[tool.semantic_release.branches.main]
match = "^main$"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "docs", "refactor", "test", "build", "ci", "chore", "style"]
other_allowed_tags = []
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.ruff]
line-length = 100
