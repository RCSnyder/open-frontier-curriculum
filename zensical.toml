[project]
site_name = "Open Frontier Curriculum"
site_description = "Foundations, frontier technologies, and human judgment for the 21st century."
site_author = "Open Frontier Curriculum contributors"
site_url = "https://rcsnyder.github.io/open-frontier-curriculum/"
repo_url = "https://github.com/RCSnyder/open-frontier-curriculum"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
copyright = "Open Frontier Curriculum text: CC BY 4.0"
extra_css = ["stylesheets/extra.css"]

# Keep navigation intentionally shallow. The Frontier 100 is explored through
# class/track indexes and search rather than putting 100 pages in the sidebar.
nav = [
  { "Home" = "index.md" },
  { "Start here" = [
    "00-start-here/README.md",
    "00-start-here/choose-your-path.md",
    "00-start-here/first-30-days.md",
    "00-start-here/execution-modes.md",
    "00-start-here/using-ai.md",
  ] },
  { "Program" = [
    "01-program/README.md",
    "01-program/premise.md",
    "01-program/dependency-map.md",
    "02-core/README.md",
  ] },
  { "Foundations I" = [
    "02-core/wave-1/README.md",
    "02-core/wave-1/01-mathematical-reasoning-proof.md",
    "02-core/wave-1/02-calculus-vector-calculus.md",
