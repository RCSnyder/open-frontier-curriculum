[project]
site_name = "Open Frontier Curriculum"
site_description = "Capability, context, judgment and representation, brought together through practice."
site_url = "https://rcsnyder.github.io/open-frontier-curriculum/"
repo_url = "https://github.com/RCSnyder/open-frontier-curriculum"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/extra.css", "stylesheets/atlas.css"]
extra_javascript = ["javascripts/atlas.js"]
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Four foundations" = [
    { "Open Frontier" = "foundations/capability.md" },
    { "Human Worlds" = "foundations/context.md" },
    { "Philosophy" = "foundations/judgment.md" },
    { "Expressive Command" = "foundations/representation.md" }
  ] },
  { "Praxis" = "praxis/index.md" },
  { "Study routes" = [
    { "Find your starting point" = "paths/index.md" },
    { "Learning to learn" = "foundations/learning.md" },
    { "Life in practice" = "life/index.md" },
    { "Specializations" = "03-specializations/README.md" },
    { "Science Fiction to Science" = "05-frontier/README.md" }
  ] },
  { "Library" = "library/index.md" },
  { "About the project" = [
    { "Purpose and limits" = "project/index.md" },
    { "Publication status and evidence" = "project/evidence.md" },
    { "Contribute" = "08-community/README.md" }
  ] }
]

[project.theme]
variant = "modern"
font = false
features = ["navigation.sections", "navigation.indexes", "navigation.top", "search.highlight", "content.code.copy"]

[project.theme.icon]
logo = "lucide/compass"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
meta = {}
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
