    "02-core/wave-1/10-control-estimation.md",
    "02-core/wave-1/11-metrology-experiments.md",
  ] },
  { "Foundations II" = [
    "02-core/wave-2/README.md",
    "02-core/wave-2/01-mechanics-electromagnetism.md",
    "02-core/wave-2/02-thermodynamics-statistical-mechanics.md",
    "02-core/wave-2/03-quantum-condensed-matter.md",
    "02-core/wave-2/04-chemistry-materials.md",
    "02-core/wave-2/05-electronics-embedded-systems.md",
    "02-core/wave-2/06-mechanical-design-fluids-structures.md",
    "02-core/wave-2/07-molecular-cell-biology.md",
