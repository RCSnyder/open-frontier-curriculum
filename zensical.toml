  { "Human systems" = [
    "04-integration/README.md",
    "04-integration/human-systems.md",
  ] },
  { "Frontier 100" = [
    "05-frontier/README.md",
    "05-frontier/by-track.md",
    "05-frontier/technology-map.md",
    "05-frontier/class-a.md",
