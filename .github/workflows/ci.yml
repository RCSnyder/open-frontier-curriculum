name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Lint public prose
        run: uv run --frozen python scripts/lint_prose.py --strict

      - name: Validate curriculum structure
        run: uv run --frozen python scripts/validate_repo.py

      - name: Audit UI source
        run: uv run --frozen python scripts/audit_ui.py

      - name: Audit color contrast
        run: uv run --frozen python scripts/audit_contrast.py

      - name: Build Zensical site
        run: uv run --frozen zensical build --clean

      - name: Audit built site
        run: uv run --frozen python scripts/audit_ui.py --site site

  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    concurrency:
      group: semantic-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Pin checkout to tested commit
        run: git reset --hard "${{ github.sha }}"

      - name: Bootstrap baseline release when no version tags exist
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if git tag --list 'v[0-9]*' | grep -q .; then
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="$(sed -nE 's/^version = "([^"]+)"/\1/p' release.toml)"
          test -n "$version"
          tag="v${version}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes "Baseline release for automated Conventional Commit versioning."

          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Semantic version release
        id: semantic
        if: steps.bootstrap.outputs.bootstrapped != 'true'
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions[bot]"
          git_committer_email: "41898282+github-actions[bot]@users.noreply.github.com"

  pages-build:
    name: pages-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Build Zensical site
        run: uv run --frozen zensical build --clean

      - name: Audit built site
        run: uv run --frozen python scripts/audit_ui.py --site site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages-deploy:
    name: pages-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
