name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.7"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen ruff check scripts tests
      - run: uv run --frozen python -m compileall -q scripts tests
      - run: uv run --frozen python -m unittest discover -s tests
      - run: uv run --frozen python scripts/validate_repo.py
      - run: uv run --frozen python scripts/audit_obelisk.py --check
      - run: uv run --frozen python scripts/generate_obelisk_catalog.py --check
      - run: uv run --frozen python scripts/lint_prose.py --strict
      - run: uv run --frozen python scripts/audit_ui.py
      - run: uv run --frozen python scripts/audit_contrast.py
      - run: uv run --frozen python scripts/check_obelisk_release_readiness.py --claim candidate
      - run: uv run --frozen zensical build --clean
      - run: uv run --frozen python scripts/audit_ui.py --site site
